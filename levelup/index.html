           '<div class="label">' + esc(tr("next_step")) + " · " + esc(T(stageById(nt.st).name)) + "</div>" +
           '<div class="next-title">' + esc(T(nt.title)) + "</div>" +
           '<div class="next-desc">' + esc(T(nt.desc)) + "</div>" +
           '<div class="next-meta">' +
             '<span class="chip t-' + nt.t + '">' + tp.icon + " " + esc(T(tp.name)) + "</span>" +
             (showsTime(nt) ? '<span class="chip">⏱ ' + timeLabel(nt.min) + "</span>" : "") +
             '<span class="chip pts">💎 ' + nt.pts + " " + esc(unitOf()) + "</span>" +
             (nt.gift ? '<span class="chip gift">🎁 ' + esc(T(nt.gift.title)) + "</span>" : "") +
           "</div>" +
           '<button class="btn primary" onclick="openTask(&quot;' + nt.id + '&quot;)">' + esc(tr("open")) + "</button>" +
         "</div>";
  } else {
    h += '<div class="next"><div class="label">' + esc(tr("all_done")) + '</div><div class="next-title">🏁 ' + esc(tr("all_done_sub")) + "</div></div>";
  }
  h += "</div>";

  /* путь по модулям */
  var stages = n.stages, nowIdx = -1, steps = "";
  for (var s = 0; s < stages.length; s++) {
    var ss = stageStats(stages[s].id);
    if (nowIdx === -1 && ss.done < ss.total) nowIdx = s;
  }
  for (var k = 0; k < stages.length; k++) {
    var st = stages[k], sst = stageStats(st.id), full = sst.done === sst.total;
    var cls = "path-step" + (full ? " done" : "") + (k === nowIdx ? " now" : "") + (st.boss ? " boss" : "");
    if (nowIdx === -1 || k <= nowIdx) cls += " fill-l";
    if (nowIdx === -1 || k < nowIdx) cls += " fill-r";
    steps += '<div class="' + cls + '"><div class="path-dot">' + (full ? "✓" : st.boss ? "👑" : st.id) + "</div>" +
             '<div class="path-lbl">' + esc(T(st.name)) + '<br><span style="opacity:.65">' + sst.done + " / " + sst.total + "</span></div></div>";
  }
  h += '<div class="card" style="margin-bottom:14px"><div class="card-h">' + esc(tr("path")) + '</div><div class="path">' + steps + "</div></div>";

  /* направления + лента */
  var br = "";
  for (var b = 0; b < n.branches.length; b++) {
    var bb = n.branches[b], tot = 0, dn = 0, av = 0;
    for (var q = 0; q < n.tasks.length; q++) {
      var tq = n.tasks[q];
      if (tq.br !== bb.id) continue;
      tot++;
      if (isDone(tq.id)) dn++; else if (isUnlocked(tq)) av++;
    }
    br += '<button class="branch-line" onclick="goBranch(&quot;' + bb.id + '&quot;)">' +
            '<div class="branch-top"><span>' + bb.icon + "</span><span>" + esc(T(bb.name)) + "</span>" +
              (av ? '<span class="branch-avail">' + esc(tr("available", { n: av })) + "</span>" : '<span style="margin-left:auto"></span>') +
              '<span class="branch-num">' + dn + " / " + tot + "</span></div>" +
            '<div class="bar"><i style="width:' + Math.round(dn / tot * 100) + '%"></i></div>' +
          "</button>";
  }
  var fd = "";
  if (!S.feed.length) fd = '<div style="color:var(--text-mute);font-size:13.5px">' + esc(tr("feed_empty")) + "</div>";
  for (var f = 0; f < S.feed.length; f++) {
    /* текст собирается при показе, чтобы лента переводилась вместе с языком */
    var it = S.feed[f];
    fd += '<div class="feed-item"><div class="feed-ic">' + it.ic + '</div><div class="feed-txt">' +
          esc(T(it.title) + " · " + it.sign + fmt(it.amount) + " " + unitOf()) + "</div></div>";
  }
  h += '<div class="grid2"><div class="card"><div class="card-h">' + esc(tr("branches")) + "</div>" + br + "</div>" +
       '<div class="card"><div class="card-h">' + esc(tr("feed")) + "</div>" + fd + "</div></div>";

  document.getElementById("scr-home").innerHTML = h;
}

function tileHtml(key) {
  var n = N(), val, lbl;
  if (key === "done")   { val = doneCount() + " / " + n.tasks.length; lbl = tr("t_done"); }
  if (key === "streak") { val = S.streak; lbl = streakWord(S.streak); }
  if (key === "time")   { val = timeLabel(totalMin()); lbl = n.timeLabel ? T(n.timeLabel) : tr("t_time"); }
  if (key === "place")  { val = "#" + groupPlace(); lbl = T(n.placeLabel); }
  if (key === "saved")  { val = money(savedTotal()); lbl = tr("t_saved"); }
  return '<div class="tile"><div class="n">' + esc(val) + '</div><div class="l">' + esc(lbl) + "</div></div>";
}

function stageById(id) {
  var s = N().stages;
  for (var i = 0; i < s.length; i++) if (s[i].id === id) return s[i];
  return s[0];
}

/* ═══════════════════════════════════════════════════════════════
   ЭКРАН: ЗАДАНИЯ
   ═══════════════════════════════════════════════════════════════ */

function renderTasks() {
  var n = N(), h = "";
  h += '<h1 class="page-title">' + esc(tr("tasks_title")) + "</h1>" +
       '<p class="page-sub">' + esc(tr("tasks_sub")) + "</p>";

  /* фильтры: все / осталось / направления */
  var left = 0;
  for (var i = 0; i < n.tasks.length; i++) if (!isDone(n.tasks[i].id)) left++;
  var fh = '<button class="fchip' + (FILTER === "all" ? " on" : "") + '" onclick="setFilter(&quot;all&quot;)">' + esc(tr("f_all")) + " · " + n.tasks.length + "</button>" +
           '<button class="fchip' + (FILTER === "left" ? " on" : "") + '" onclick="setFilter(&quot;left&quot;)">' + esc(tr("f_left")) + " · " + left + "</button>";
  for (var b = 0; b < n.branches.length; b++) {
    var bb = n.branches[b], c = 0;
    for (var q = 0; q < n.tasks.length; q++) if (n.tasks[q].br === bb.id) c++;
    fh += '<button class="fchip' + (FILTER === bb.id ? " on" : "") + '" onclick="setFilter(&quot;' + bb.id + '&quot;)">' + bb.icon + " " + esc(T(bb.name)) + " · " + c + "</button>";
  }
  h += '<div class="switch-row">' + fh + "</div>";

  /* список по модулям */
  var firstOpen = null, curStage = null;
  for (var k = 0; k < n.tasks.length; k++) {
    var t = n.tasks[k];
    if (FILTER === "left" && isDone(t.id)) continue;
    if (FILTER !== "all" && FILTER !== "left" && t.br !== FILTER) continue;

    if (t.st !== curStage) {
      curStage = t.st;
      var ss = stageStats(t.st);
      h += '<div class="stage-head">' + esc(T(stageById(t.st).name)) +
             '<span class="stage-meta">' + ss.done + " / " + ss.total + " · " +
               (ss.done < ss.total
                 ? esc(N().showTime === false ? tr("left_tasks", { n: ss.total - ss.done }) : tr("left_time", { t: timeLabel(ss.left) }))
                 : esc(tr("stage_done"))) + "</span>" +
             '<span class="bar stage-bar"><i style="width:' + Math.round(ss.done / ss.total * 100) + '%"></i></span>' +
           "</div>";
    }

    var done = isDone(t.id), un = isUnlocked(t), lock = !un && !done, open = un && !done;
    if (open && !firstOpen) firstOpen = t.id;
    var tp = n.types[t.t];
    var cls = "task" + (done ? " is-done" : "") + (lock ? " is-lock" : "") + (open ? " is-open" : "") +
              (open && t.id === firstOpen ? " is-next" : "") + (t.t === "boss" ? " is-boss" : "");

    h += '<div class="' + cls + '" id="task-' + t.id + '">' +
           '<div class="task-head">' +
             '<button class="task-check" onclick="toggleTask(&quot;' + t.id + '&quot;, this)">✓</button>' +
             (t.t === "boss" && !lock ? '<span class="task-crown">👑</span>' : "") +
             '<div class="task-body" onclick="toggleOpen(&quot;' + t.id + '&quot;)">' +
               (t.id === firstOpen ? '<div class="task-now">' + esc(tr("do_now")) + "</div>" : "") +
               '<div class="task-title">' + esc(T(t.title)) + "</div>" +
               (lock
                 ? '<div class="task-lockmeta">🔒 ' + esc(tr("locked_later")) +
                     (showsTime(t) ? " · ⏱ " + timeLabel(t.min) : "") + " · 💎 " + t.pts +
                     (t.gift ? " · 🎁 " + esc(T(t.gift.title)) : "") + "</div>"
                 : '<div class="task-meta">' +
                     '<span class="chip t-' + t.t + '">' + tp.icon + " " + esc(T(tp.name)) + "</span>" +
                     (showsTime(t) ? '<span class="chip">⏱ ' + timeLabel(t.min) + "</span>" : "") +
                     '<span class="chip pts' + (t.pts >= 300 ? " big" : "") + '">💎 ' + t.pts + "</span>" +
                     (t.gift ? '<span class="chip gift">🎁 ' + esc(T(t.gift.title)) + "</span>" : "") +
                   "</div>") +
             "</div>" +
             '<div class="task-arrow" onclick="toggleOpen(&quot;' + t.id + '&quot;)">▶</div>' +
           "</div>" +
           '<div class="task-detail">' +
             '<div class="task-desc">' + esc(T(t.desc)) + "</div>" +
             (t.steps ? '<ul class="task-steps">' + t.steps.map(function (s) { return "<li>" + esc(T(s)) + "</li>"; }).join("") + "</ul>" : "") +
           "</div>" +
         "</div>";
  }
  document.getElementById("scr-tasks").innerHTML = h;
}

function setFilter(f) { FILTER = f; renderTasks(); }

function goBranch(id) { FILTER = id; renderTasks(); go("tasks"); }

function toggleOpen(id) {
  var el = document.getElementById("task-" + id);
  if (el) el.classList.toggle("open");
}

function openTask(id) {
  FILTER = "all";
  renderTasks();
  go("tasks");
  setTimeout(function () {
    var el = document.getElementById("task-" + id);
    if (!el) return;
    el.classList.add("open");
    el.scrollIntoView({ behavior: "smooth", block: "center" });
  }, 60);
}

/* ═══════════════════════════════════════════════════════════════
   ДЕЙСТВИЕ: ОТМЕТИТЬ ЗАДАНИЕ
   ═══════════════════════════════════════════════════════════════ */

function toggleTask(id, btn) {
  var t = taskById(id);
  if (!t) return;

  if (isDone(id)) { delete S.done[id]; renderAll(); return; }
  if (!isUnlocked(t)) { toast(tr("toast_locked")); return; }

  var n = N();
  var before = levelOf(totalPts()).lvl, rBefore = rankIndex(before);
  S.done[id] = true;
  S.today += dayValue(t);
  var after = levelOf(totalPts()).lvl, rAfter = rankIndex(after);
  S.feed.unshift({ ic: n.types[t.t].icon, title: t.title, sign: "+", amount: t.pts });
  if (S.feed.length > 6) S.feed.pop();

  pop(btn, "+" + t.pts);
  renderAll();

  var stats = '<div class="modal-stats">' +
    '<div><div class="n">' + after + '</div><div class="l">' + esc(tr("m_stat_level")) + "</div></div>" +
    '<div><div class="n">' + doneCount() + '</div><div class="l">' + esc(tr("m_stat_done")) + "</div></div>" +
    '<div><div class="n">' + S.streak + '</div><div class="l">' + esc(streakWord(S.streak)) + "</div></div></div>";

  if (t.t === "boss") {
    confetti(110);
    /* главное испытание часто совпадает с новым статусом — не прячем его */
    var rankUp = rAfter !== rBefore
      ? '<div style="margin-top:14px;padding:12px;border:1px solid var(--accent-line);border-radius:var(--radius-sm);background:var(--accent-soft)">' +
          '<div class="label" style="margin-bottom:6px">' + esc(tr("m_rank")) + "</div>" +
          '<div style="font-size:17px;font-weight:750;color:' + rankColor(rAfter) + '">' + n.ranks[rAfter].icon + " " + esc(T(n.ranks[rAfter].name)) + "</div></div>"
      : "";
    modal('<div class="label">' + esc(tr("m_boss")) + "</div>" +
          '<div class="modal-big">👑</div><h3>' + esc(T(t.title)) + "</h3>" +
          '<p>+' + t.pts + " " + esc(unitOf()) + (t.gift ? " · 🎁 " + esc(T(t.gift.title)) : "") + "</p>" + rankUp + stats);
  } else if (rAfter !== rBefore) {
    confetti(80);
    var R = n.ranks[rAfter];
    modal('<div class="label">' + esc(tr("m_rank")) + "</div>" +
          '<div class="modal-big">' + R.icon + '</div><h3 style="color:' + rankColor(rAfter) + '">' + esc(T(R.name)) + "</h3>" + stats);
  } else if (after > before) {
    confetti(45);
    modal('<div class="label">' + esc(tr("m_level")) + '</div><div class="modal-big" style="font-weight:800;color:var(--accent)">' + after + "</div>" + stats);
  } else {
    toast("+" + t.pts + " " + unitOf() + (t.gift ? " · 🎁 " + T(t.gift.title) : ""), true);
  }
}

/* ═══════════════ Окна и эффекты ═══════════════ */

function modal(html) {
  document.getElementById("modal").innerHTML = html + '<button class="btn primary" onclick="closeModal()">' + esc(tr("m_next")) + "</button>";
  document.getElementById("overlay").classList.add("show");
  /* подсказка поверх окна наезжает на кнопку на маленьких телефонах — убираем */
  var t = document.getElementById("toast");
  clearTimeout(toastT); t.className = "toast";
}
function closeModal() { document.getElementById("overlay").classList.remove("show"); }
document.getElementById("overlay").addEventListener("click", function (e) { if (e.target.id === "overlay") closeModal(); });

var toastT = null;
function toast(msg, gold) {
  var el = document.getElementById("toast");
  if (document.getElementById("overlay").classList.contains("show")) return;
  el.textContent = msg;
  el.className = "toast show" + (gold ? " gold" : "");
  clearTimeout(toastT);
  toastT = setTimeout(function () { el.className = "toast"; }, 2300);
}

function pop(el, text) {
  if (!el) return;
  var r = el.getBoundingClientRect(), d = document.createElement("div");
  d.className = "pop"; d.textContent = text;
  d.style.left = (r.left + r.width / 2 - 20) + "px"; d.style.top = (r.top - 6) + "px";
  document.body.appendChild(d);
  setTimeout(function () { d.remove(); }, 1200);
}

function confetti(count) {
  var cs = getComputedStyle(document.documentElement);
  var colors = ["--accent", "--gold", "--success", "--boss", "--rank-6"].map(function (v) { return cs.getPropertyValue(v).trim(); });
  for (var i = 0; i < count; i++) {
    (function (k) {
      setTimeout(function () {
        var p = document.createElement("div");
        p.className = "confetti";
        p.style.left = Math.random() * 100 + "vw";
        p.style.background = colors[k % colors.length];
        p.style.animation = "fall " + (2.2 + Math.random() * 1.6) + "s linear forwards";
        if (Math.random() > .6) p.style.borderRadius = "50%";
        document.body.appendChild(p);
        setTimeout(function () { p.remove(); }, 4200);
      }, k * 20);
    })(i);
  }
}

function spawnMotes() {
  var box = document.getElementById("motes"), n = window.innerWidth < 820 ? 10 : 18, h = "";
  for (var i = 0; i < n; i++) {
    var dur = 16 + Math.random() * 20, sz = 2 + Math.random() * 2.5;
    h += '<div class="mote" style="left:' + (Math.random() * 100).toFixed(1) + "%;width:" + sz.toFixed(1) + "px;height:" + sz.toFixed(1) +
         "px;animation-duration:" + dur.toFixed(1) + "s;animation-delay:-" + (Math.random() * dur).toFixed(1) + 's"></div>';
  }
  box.innerHTML = h;
}

/* ═══════════════════════════════════════════════════════════════
   ЭКРАН: КАРТА ПУТИ
   Тропинка змейкой. Координаты по X — в процентах, поэтому
   карта сама подстраивается под ширину, а линия не искажается
   (vector-effect: non-scaling-stroke).
   ═══════════════════════════════════════════════════════════════ */

function renderMap() {
  var n = N(), nt = nextTask(), nowId = nt ? nt.id : null;
  var h = '<h1 class="page-title">' + esc(tr("map_title")) + "</h1>" +
          '<p class="page-sub">' + esc(tr("map_sub")) + "</p>";
  var idx = 0, STEP = 122, TOP = 44;

  for (var si = 0; si < n.stages.length; si++) {
    var st = n.stages[si], list = [];
    for (var i = 0; i < n.tasks.length; i++) if (n.tasks[i].st === st.id) list.push(n.tasks[i]);
    var ss = stageStats(st.id), full = ss.done === ss.total;

    h += '<div class="map-stage">' +
           '<div class="map-head' + (full ? " done" : "") + (st.boss ? " is-boss" : "") + '">' +
             '<div class="map-head-n">' + (full ? "✓" : st.boss ? "👑" : st.id) + "</div>" +
             '<div><div class="map-head-t">' + esc(T(st.name)) + '</div><div class="map-head-s">' + ss.done + " / " + ss.total + "</div></div>" +
             '<span class="bar"><i style="width:' + Math.round(ss.done / ss.total * 100) + '%"></i></span>' +
           "</div>";

    var pts = [];
    for (var k = 0; k < list.length; k++) {
      pts.push({ x: 50 + 26 * Math.sin((idx + k) * 0.95 + 0.5), y: TOP + k * STEP, t: list[k] });
    }
    var last = pts[pts.length - 1];
    var H = last.y + (last.t.t === "boss" ? 96 : 80);

    /* линия: вся тропинка пунктиром и пройденная часть сплошной */
    var dAll = "", dDone = "", lastDoneIdx = -1;
    for (var q = 0; q < pts.length; q++) if (isDone(pts[q].t.id)) lastDoneIdx = q;
    for (var z = 1; z < pts.length; z++) {
      var a = pts[z - 1], b = pts[z];
      var seg = (z === 1 ? "M" + a.x + " " + a.y : "") + " C" + a.x + " " + (a.y + STEP / 2) + "," + b.x + " " + (b.y - STEP / 2) + "," + b.x + " " + b.y;
      dAll += seg;
      if (z <= lastDoneIdx + (nowId && pts[Math.min(lastDoneIdx + 1, pts.length - 1)].t.id === nowId ? 1 : 0)) dDone += seg;
    }

    var nodes = "";
    for (var m = 0; m < pts.length; m++) {
      var t = pts[m].t, done = isDone(t.id), un = isUnlocked(t), lock = !done && !un, boss = t.t === "boss";
      var cls = "map-node" + (done ? " done" : "") + (lock ? " lock" : "") + (!done && un ? " open" : "") +
                (t.id === nowId ? " now" : "") + (boss ? " boss" : "");
      var half = boss ? 42 : 32;
      var icon = done ? "✓" : lock ? "🔒" : boss ? "👑" : n.types[t.t].icon;
      nodes += '<button class="' + cls + '" style="left:calc(' + pts[m].x.toFixed(2) + "% - " + half + "px);top:" + (pts[m].y - half) + 'px"' +
               ' title="' + esc(T(t.title)) + '" onclick="openTask(&quot;' + t.id + '&quot;)">' + icon + "</button>" +
               '<div class="map-lbl" style="left:calc(' + pts[m].x.toFixed(2) + '% - var(--lbl-half, 75px));top:' + (pts[m].y + half + 6) + 'px">' +
                 (t.id === nowId ? '<span class="map-now-tag">' + esc(tr("map_now")) + "</span><br>" : "") +
                 '<span class="map-lbl-in">' + esc(T(t.title)) + "</span>" +
               "</div>";
    }

    h += '<div class="map-track" style="height:' + H + 'px">' +
           '<svg class="map-svg" viewBox="0 0 100 ' + H + '" preserveAspectRatio="none" height="' + H + '">' +
             '<path class="map-line" d="' + dAll + '"/>' +
             (dDone ? '<path class="map-line passed" d="' + dDone + '"/>' : "") +
           "</svg>" + nodes +
         "</div></div>";
    idx += list.length;
  }
  document.getElementById("scr-map").innerHTML = h;
}

/* ═══════════════════════════════════════════════════════════════
   ЭКРАН: РЕЙТИНГ
   Соседи по таблице собираются вокруг очков самого пользователя,
   поэтому рейтинг правдоподобен на любом этапе.
   ═══════════════════════════════════════════════════════════════ */

var TOP_TAB = "all";
function setTopTab(v) { TOP_TAB = v; renderTop(); }

function initials(name) {
  var parts = name.replace(/\./g, "").split(" ");
  return (parts[0] ? parts[0][0] : "") + (parts[1] ? parts[1][0] : "");
}

function capFirst(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

function buildBoard() {
  var n = N(), seed = ALL_NICHES.indexOf(P.niche) * 5 + 3, names = NAMES[P.lang] || NAMES.ru;
  var mult = TOP_TAB === "week" ? .22 : TOP_TAB === "month" ? .6 : 1;
  var basePlace = groupPlace();
  var place = TOP_TAB === "week" ? Math.max(1, basePlace - 2) : basePlace;
  var mine = Math.max(10, Math.round(totalPts() * mult));
  var step = Math.max(14, Math.round(Math.max(totalPts(), 400) * .06 * mult));
  var rows = [], p = 0;
  /* Имя и инициал комбинируются так, что в группе до 120 человек повторов нет:
     имя зависит от p mod 24, а для «того же» имени сдвигается инициал */
  function uniqueName() {
    var L = names.length, a = (p * 5 + seed) % L, b = (p + Math.floor(p / L) * 5 + seed) % L;
    p++;
    return names[a].split(" ")[0] + " " + names[b].split(" ")[1];
  }
  for (var k = 1; k <= n.group; k++) {
    var jitter = ((k * 17 + seed) % 9);
    var pts = k < place ? mine + (place - k) * step + jitter
            : k > place ? Math.max(0, mine - Math.round((k - place) * step * .55) - jitter)
            : mine;
    var isMe = k === place;
    var name = isMe ? T(n.hero) : uniqueName();
    var mv = isMe ? (P.stage === "day1" ? 0 : P.stage === "month" ? 4 : 1) : ((k * 13 + seed) % 5) - 2;
    rows.push({ place: k, name: name, pts: pts, me: isMe, move: mv });
  }
  return rows;
}

function moveHtml(mv) {
  if (mv > 0) return '<span class="lb-move up">▲ ' + mv + "</span>";
  if (mv < 0) return '<span class="lb-move down">▼ ' + (-mv) + "</span>";
  return '<span class="lb-move same">—</span>';
}

function renderTop() {
  var n = N(), rows = buildBoard();
  var me = rows.filter(function (r) { return r.me; })[0];
  var h = '<h1 class="page-title">' + esc(tr("top_title")) + "</h1>" +
          '<p class="page-sub">' + esc(capFirst(T(n.placeLabel))) + " · " + esc(tr("top_sub")) + "</p>";

  h += '<div class="top-tabs">';
  ["week", "month", "all"].forEach(function (v) {
    h += '<button class="fchip' + (TOP_TAB === v ? " on" : "") + '" onclick="setTopTab(&quot;' + v + '&quot;)">' + esc(tr("tab_" + v)) + "</button>";
  });
  h += "</div>";

  /* пьедестал: визуально 2 — 1 — 3 */
  var medal = ["🥇", "🥈", "🥉"];
  h += '<div class="podium">';
  [1, 0, 2].forEach(function (i) {
    var r = rows[i];
    h += '<div class="pod p' + (i + 1) + (r.me ? " me" : "") + '">' +
           '<div class="pod-medal">' + medal[i] + "</div>" +
           '<div class="pod-av">' + esc(initials(r.name)) + "</div>" +
           '<div class="pod-name">' + esc(r.name) + (r.me ? '<span class="lb-you">' + esc(tr("you")) + "</span>" : "") + "</div>" +
           '<div class="pod-pts">' + fmt(r.pts) + " " + esc(unitOf()) + "</div>" +
         "</div>";
  });
  h += "</div>";

  /* таблица: места 4–10, а если пользователь ниже — разрыв и его окружение */
  var show = rows.slice(3, 10);
  var tail = [];
  if (me.place > 10) tail = rows.slice(me.place - 2, Math.min(me.place + 1, rows.length));
  var row = function (r) {
    return '<div class="lb-row' + (r.me ? " me" : "") + '">' +
             '<span class="lb-place">' + r.place + "</span>" +
             '<span class="lb-av">' + esc(initials(r.name)) + "</span>" +
             '<span class="lb-name">' + esc(r.name) + (r.me ? '<span class="lb-you">' + esc(tr("you")) + "</span>" : "") + "</span>" +
             moveHtml(r.move) +
             '<span class="lb-pts">' + fmt(r.pts) + "</span>" +
           "</div>";
  };
  /* разрыв «···» только когда между 10-м местом и окружением пользователя реально есть пропуск */
  var gap = tail.length && tail[0].place > 11;
  h += '<div class="lb">' + show.map(row).join("") +
       (tail.length ? (gap ? '<div class="lb-gap">···</div>' : "") + tail.map(row).join("") : "") +
       "</div>";

  document.getElementById("scr-top").innerHTML = h;
}

/* ═══════════════════════════════════════════════════════════════
   ЭКРАН: НАГРАДЫ
   ═══════════════════════════════════════════════════════════════ */

function renderRewards() {
  var n = N(), bal = balance();
  var h = '<h1 class="page-title">' + esc(tr("rw_title")) + "</h1>" +
          '<p class="page-sub">' + esc(tr("rw_sub")) + "</p>";

  h += '<div class="wallet">' +
         '<div><div class="wallet-n">💎 ' + fmt(bal) + "</div>" +
           '<div class="wallet-l">' + esc(unitOf()) + " " + esc(tr("balance")) + "</div></div>" +
         '<div class="wallet-note">' + esc(tr("earned", { n: fmt(totalPts()) + " " + unitOf() })) + "</div>" +
       "</div>";

  h += '<div class="card-h">' + esc(tr("rw_shop")) + '</div><div class="shop">';
  for (var i = 0; i < n.rewards.length; i++) {
    var r = n.rewards[i], got = S.claimed.indexOf(r.id) > -1, can = !got && bal >= r.cost;
    var foot;
    if (got) foot = '<span class="rw-got">✓ ' + esc(tr("claimed")) + "</span>";
    else if (can) foot = '<button class="btn primary sm rw-btn" onclick="claimReward(&quot;' + r.id + '&quot;, this)">' + esc(tr("claim")) + "</button>";
    else foot = '<span class="rw-need">' + esc(tr("need", { n: fmt(r.cost - bal) })) + "</span>";
    h += '<div class="rw' + (got ? " claimed" : "") + '">' +
           '<div class="rw-ic">' + r.icon + "</div>" +
           '<div class="rw-t">' + esc(T(r.title)) + "</div>" +
           '<div class="rw-d">' + esc(T(r.desc)) + "</div>" +
           '<div class="rw-foot"><span class="rw-cost">💎 ' + fmt(r.cost) + "</span>" + foot + "</div>" +
           (!got && !can ? '<div class="bar rw-bar"><i style="width:' + Math.min(100, Math.round(bal / r.cost * 100)) + '%"></i></div>' : "") +
         "</div>";
  }
  h += "</div>";

  /* подарки за задания — если ниша их выдаёт */
  var hasGifts = n.tasks.some(function (t) { return t.gift; });
  if (hasGifts) {
    var list = "", sum = 0;
    for (var k = 0; k < n.tasks.length; k++) {
      var t = n.tasks[k];
      if (!t.gift || !isDone(t.id)) continue;
      sum += cash(t.gift.value || 0);
      list += '<div class="feed-item"><div class="feed-ic">🎁</div><div class="feed-txt">' + esc(T(t.gift.title)) +
              '<div style="font-size:12px;color:var(--text-mute)">' + esc(T(t.title)) + "</div></div>" +
              '<span class="gift-val">' + money(cash(t.gift.value)) + "</span></div>";
    }
    h += '<div class="card gifts-list"><div class="card-h" style="display:flex;gap:10px;align-items:baseline">' + esc(tr("rw_gifts")) +
         (sum ? '<span style="font-size:13px;color:var(--success);font-weight:700">' + esc(tr("rw_gifts_sum", { n: money(sum) })) + "</span>" : "") + "</div>" +
         (list || '<div style="color:var(--text-mute);font-size:13.5px">' + esc(tr("rw_gifts_empty")) + "</div>") + "</div>";
  }

  document.getElementById("scr-rewards").innerHTML = h;
}

function claimReward(id, btn) {
  var r = N().rewards.filter(function (x) { return x.id === id; })[0];
  if (!r || balance() < r.cost || S.claimed.indexOf(id) > -1) return;
  S.spent += r.cost;
  S.claimed.push(id);
  S.feed.unshift({ ic: "🎁", title: r.title, sign: "−", amount: r.cost });
  if (S.feed.length > 6) S.feed.pop();
  pop(btn, "−" + fmt(r.cost));
  renderAll();
  confetti(55);
  modal('<div class="label">' + esc(tr("m_reward")) + '</div><div class="modal-big">' + r.icon + "</div>" +
        "<h3>" + esc(T(r.title)) + "</h3><p>" + esc(T(r.desc)) + "</p>");
}

/* ═══════════════════════════════════════════════════════════════
   ЭКРАН: ПРОФИЛЬ
   ═══════════════════════════════════════════════════════════════ */

function dayWord(k) { return P.lang === "en" ? (k === 1 ? "day" : "days") : plural(k, "день", "дня", "дней"); }

function renderProfile() {
  var n = N(), xp = totalPts(), L = levelOf(xp), ri = rankIndex(L.lvl), R = n.ranks[ri];
  var h = "";

  /* шапка профиля */
  h += '<div class="hero corners"><div class="prof-top">' +
         '<div class="rank-av" style="color:' + rankColor(ri) + '">' + R.icon + "</div>" +
         "<div>" +
           '<div class="hero-name">' + esc(T(n.hero)) + "</div>" +
           '<div class="hero-rank" style="color:' + rankColor(ri) + '">' + esc(T(R.name)) + " · " + esc(tr("level")) + " " + L.lvl + "</div>" +
           '<div class="prof-meta">' + esc(tr("pr_with", { n: S.joined, d: dayWord(S.joined) })) + "</div>" +
         "</div>" +
       "</div>" +
       '<div class="tiles">' + ["done", "streak", "place"].map(tileHtml).join("") +
         '<div class="tile"><div class="n">💎 ' + fmt(balance()) + '</div><div class="l">' + esc(tr("balance")) + "</div></div>" +
       "</div></div>";

  /* лестница статусов + достижения */
  var ladder = "";
  for (var i = 0; i < n.ranks.length; i++) {
    var rk = n.ranks[i], state = i < ri ? "passed" : i === ri ? "current passed" : "future";
    ladder += '<div class="ladder-step ' + state + '" style="color:' + rankColor(i) + '">' +
                '<div class="ladder-ic">' + rk.icon + "</div>" +
                '<div><div class="ladder-name" style="color:' + (i <= ri ? rankColor(i) : "var(--text-mute)") + '">' + esc(T(rk.name)) + "</div>" +
                  '<div class="ladder-lvl">' + esc(tr("pr_lvl", { n: rk.lvl })) + "</div></div>" +
                (i === ri ? '<span class="ladder-badge">' + esc(tr("pr_now")) + "</span>" : "") +
              "</div>";
  }

  var got = 0, cards = "";
  for (var a = 0; a < ACHIEVEMENTS.length; a++) {
    var ac = ACHIEVEMENTS[a], ok = ac.test();
    if (ok) got++;
    /* в английском «7-day streak», а не «7 days streak» */
    var desc = tr("a_" + ac.id + "_d", ac.n ? { n: P.lang === "en"
      ? ac.n() + (N().streakUnit === "week" ? "-week" : "-day")
      : ac.n() + " " + (N().streakUnit === "week" ? plural(ac.n(), "неделя", "недели", "недель") : dayWord(ac.n())) } : null);
    cards += '<div class="ach' + (ok ? " got" : "") + '"><div class="ach-ic">' + ac.icon + "</div>" +
             '<div class="ach-t">' + esc(tr("a_" + ac.id)) + '</div><div class="ach-d">' + esc(desc) + "</div></div>";
  }

  h += '<div class="grid2" style="margin-bottom:14px">' +
         '<div class="card"><div class="card-h">' + esc(tr("pr_ladder")) + '</div><div class="ladder">' + ladder + "</div></div>" +
         '<div class="card"><div class="card-h">' + esc(tr("pr_ach")) + "</div>" +
           '<div class="ach-count"><b>' + got + "</b><span style=\"color:var(--text-mute)\">" + esc(tr("pr_of", { n: ACHIEVEMENTS.length })) + "</span>" +
             '<span class="bar" style="flex:1"><i style="width:' + Math.round(got / ACHIEVEMENTS.length * 100) + '%;background:var(--gold)"></i></span></div>' +
           '<div class="ach-grid">' + cards + "</div></div>" +
       "</div>";

  /* календарь активности: 12 недель, последняя колонка — текущая неделя */
  var span = P.stage === "day1" ? 1 : P.stage === "month" ? 31 : 84;
  var density = P.stage === "final" ? 72 : 48;
  var todayDow = (new Date().getDay() + 6) % 7;        /* понедельник = 0 */
  var cols = "", active = 0;
  for (var w = 11; w >= 0; w--) {
    cols += '<div class="heat-col">';
    for (var d = 0; d < 7; d++) {
      var back = w * 7 + (todayDow - d);               /* сколько дней назад */
      if (back < 0) { cols += '<div class="heat-c" style="visibility:hidden"></div>'; continue; }
      var hash = (back * 37 + 11) % 97;
      var on = back < S.streak || (back < span && hash < density);
      if (on) active++;
      var lvl = on ? 1 + ((back * 13 + 5) % 4) : 0;
      cols += '<div class="heat-c' + (lvl ? " l" + lvl : "") + (back === 0 ? " is-now" : "") + '"></div>';
    }
    cols += "</div>";
  }
  var best = Math.max(S.streak, P.stage === "final" ? S.streak + 6 : S.streak);
  var calStats =
    '<div class="tile"><div class="n">' + active + '</div><div class="l">' + esc(P.lang === "en" ? "active days" : plural(active, "активный день", "активных дня", "активных дней")) + "</div></div>" +
    '<div class="tile"><div class="n">' + S.streak + '</div><div class="l">' + esc(streakWord(S.streak)) + "</div></div>" +
    '<div class="tile"><div class="n">' + best + '</div><div class="l">' + esc(P.lang === "en" ? "best streak" : "лучшая серия") + "</div></div>" +
    '<div class="tile"><div class="n">' + S.joined + '</div><div class="l">' + esc(P.lang === "en" ? "days with us" : plural(S.joined, "день с нами", "дня с нами", "дней с нами")) + "</div></div>";
  h += '<div class="card"><div class="card-h">' + esc(tr("pr_cal")) + "</div>" +
         '<div class="cal"><div><div class="heat-wrap"><div class="heat">' + cols + "</div></div>" +
         '<div class="heat-legend"><span>' + esc(tr("pr_less")) + '</span>' +
           '<span class="heat-c"></span><span class="heat-c l1"></span><span class="heat-c l2"></span><span class="heat-c l3"></span><span class="heat-c l4"></span>' +
           "<span>" + esc(tr("pr_more")) + "</span></div></div>" +
         '<div class="cal-stats">' + calStats + "</div></div>" +
       "</div>";

  document.getElementById("scr-profile").innerHTML = h;
}

/* ═══════════════ Заглушки неготовых экранов ═══════════════ */

function renderSoon() {
  for (var i = 0; i < SCREENS.length; i++) {
    if (SCREENS[i].ready) continue;
    document.getElementById("scr-" + SCREENS[i].id).innerHTML =
      '<div class="card soon-screen"><div class="big">' + SCREENS[i].icon + "</div>" +
      '<div class="card-h">' + esc(tr("soon_title")) + '</div><p style="color:var(--text-mute)">' + esc(tr("soon_sub")) + "</p></div>";
  }
}

/* ═══════════════════════════════════════════════════════════════
   СБОРКА
   ═══════════════════════════════════════════════════════════════ */

/* Шапка приложения прилипает ровно под демо-панелью, какой бы высоты та ни была */
function syncPanelHeight() {
  var h = document.getElementById("dp").offsetHeight;
  document.documentElement.style.setProperty("--dp-h", h + "px");
}
window.addEventListener("resize", syncPanelHeight);

function applyStyle() {
  document.documentElement.setAttribute("data-style", P.style);
  document.documentElement.setAttribute("lang", P.lang);
  document.title = tr("doc_title");
  var bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta && bg) meta.setAttribute("content", bg);
}

function renderAll() {
  renderPanel();
  syncPanelHeight();
  renderNav();
  renderHome();
  renderTasks();
  renderMap();
  renderTop();
  renderRewards();
  renderProfile();
}

bindSeg("seg-niche", function (v) { P.niche = v; FILTER = "all"; buildStage(P.stage); savePanel(); renderAll(); });
bindSeg("seg-style", function (v) { P.style = v; applyStyle(); savePanel(); renderAll(); });
bindSeg("seg-stage", function (v) { P.stage = v; FILTER = "all"; buildStage(v); savePanel(); renderAll(); toast(tr("reset_ok")); });
bindSeg("seg-lang",  function (v) {
  P.lang = v; applyStyle(); savePanel(); renderAll();
  /* подсказка на прежнем языке не должна висеть после переключения */
  var el = document.getElementById("toast");
  clearTimeout(toastT); el.className = "toast"; el.textContent = "";
});

document.getElementById("dp-toggle").addEventListener("click", function () {
  document.getElementById("dp").classList.toggle("open");
  syncPanelHeight();
});

function boot() {
  loadPanel();
  applyStyle();
  buildStage(P.stage);
  spawnMotes();
  renderAll();
  go("home");
}

boot();
</script>
